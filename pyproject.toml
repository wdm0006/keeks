[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keeks"
version = "0.6.0"
description = "Python bet sizing and bankroll simulation for repeated binary outcomes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Keeks Contributors"}
]
keywords = [
    "bankroll",
    "bet-sizing",
    "decision-theory",
    "kelly-criterion",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "matplotlib",
]

[project.urls]
Documentation = "https://keeks.mcginniscommawill.com/"
Examples = "https://github.com/wdm0006/keeks/tree/master/examples"
Homepage = "https://github.com/wdm0006/keeks"
Issues = "https://github.com/wdm0006/keeks/issues"
Source = "https://github.com/wdm0006/keeks"

[project.optional-dependencies]
dev = [
    "pandas",
    "pytest",
    "pytest-cov",
    "sphinx",
    "sphinxcontrib-googleanalytics",
    "flake8",
    "wheel",
    "ruff",
    "tox",
]

[tool.hatch.build.targets.wheel]
packages = ["keeks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=keeks --cov-report=term-missing"

[tool.coverage.run]
source = ["keeks"]
omit = ["tests/*"]

[tool.ruff]
line-length = 88
target-version = "py310"


[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "C4", "SIM", "ARG"]
ignore = ["E501"]  # Ignore line length errors

[tool.ruff.lint.isort]
known-first-party = ["keeks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-line-length = 88

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310, py311, py312, py313, py314
isolated_build = True
skip_missing_interpreters = True

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest {posargs:tests} --cov=keeks --cov-report=term-missing

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
"""
