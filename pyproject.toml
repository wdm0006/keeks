[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keeks"
# Version is dynamic: hatchling reads it from version.py (also the source
# the Sphinx build imports), so the version is declared exactly once.
dynamic = ["version"]
description = "Python bet sizing and bankroll simulation for repeated binary outcomes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Keeks Contributors"}
]
keywords = [
    "bankroll",
    "bet-sizing",
    "decision-theory",
    "kelly-criterion",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "matplotlib",
]

[project.urls]
Documentation = "https://keeks.mcginniscommawill.com/"
Examples = "https://github.com/wdm0006/keeks/tree/master/examples"
Homepage = "https://github.com/wdm0006/keeks"
Issues = "https://github.com/wdm0006/keeks/issues"
Source = "https://github.com/wdm0006/keeks"

[project.optional-dependencies]
# Optional solver backend for the allocation layer (keeks[allocation]): the
# scipy-gated QP/LP solvers, Gaussian-copula dependence, and Student-t
# fitting. Runtime dependencies stay numpy + matplotlib without it.
allocation = ["scipy"]
dev = [
    "hypothesis",
    "pandas",
    "pytest",
    "pytest-cov",
    # scipy ships in the dev environment so the allocation layer's
    # scipy-gated paths (Gaussian-copula dependence, Student-t fitting, and
    # the QP/LP solvers) are exercised by the test suite everywhere; it is
    # still an optional runtime extra (keeks[allocation]).
    "scipy",
    "sphinx",
    # docs/source/conf.py sets html_theme to wabi_sphinx_theme; declare it
    # so a clean `uv pip install -e ".[dev]"` can build the docs.
    "wabi_sphinx_theme",
    "sphinxcontrib-googleanalytics",
    "wheel",
    "ruff",
    "tox",
    # yfinance refreshes the ETF returns fixture behind
    # examples/allocation_etfs.py's --refresh flag. It is never imported at
    # keeks runtime — the test suite pins that import guard.
    "yfinance",
]

[tool.hatch.version]
path = "version.py"

[tool.hatch.build.targets.wheel]
packages = ["keeks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=keeks --cov-report=term-missing"

[tool.coverage.run]
source = ["keeks"]
omit = ["tests/*"]

[tool.coverage.report]
# The abstract `evaluate` stub and the base `calculate_max_entry_price` raise
# are contract-only statements exercised through subclasses.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "@abc.abstractmethod",
]

[tool.mutmut]
# mutmut copies source_paths plus tests/ and the config into a scratch
# mutants/ tree and regenerates it on every run; anything else the suite
# reads from the repo root must be listed in also_copy. Directories are
# listed as directories: file-mode entries cannot create parent paths.
source_paths = ["keeks"]
pytest_add_cli_args_test_selection = ["tests"]
# The repo's pytest addopts inject --cov flags into every mutant run; strip
# them here. mutmut already invokes pytest with -x -q, so pass/fail
# semantics are unchanged -- only the coverage overhead goes away.
pytest_add_cli_args = ["-o", "addopts="]
also_copy = [
    "README.md",
    "docs",
    "benchmarks",
    "examples",
    "CHANGELOG.md",
    "version.py",
    "Makefile",
]

[tool.ruff]
line-length = 88
target-version = "py310"


[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "C4", "SIM", "ARG"]
ignore = ["E501"]  # Ignore line length errors

[tool.ruff.lint.isort]
known-first-party = ["keeks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-line-length = 88

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310, py311, py312, py313, py314
isolated_build = True
skip_missing_interpreters = True

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest {posargs:tests} --cov=keeks --cov-report=term-missing

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
"""
