name: Run Tests

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Create virtual environment
      run: |
        uv venv
        
    - name: Install dependencies
      run: |
        uv pip install -e ".[dev]"
        
    - name: Run tests with pytest
      # The suite measures 100% of 692 statements post-hardening (the abstract
      # evaluate stub is contract-only, excluded via [tool.coverage.report]);
      # fail-under 99 leaves slack while still failing any real regression.
      run: |
        uv run pytest tests --cov=keeks --cov-report=term-missing --cov-fail-under=99

    - name: Run docstring examples
      run: |
        uv run pytest --doctest-modules keeks/

    - name: Version consistency (keeks.__version__ == pyproject)
      # Explicit per-matrix-leg gate for the version-consistency contract from
      # the hardening suite; -o addopts= skips coverage overhead for this
      # one-file check. The full-suite run above already includes it.
      run: |
        uv run pytest tests/test_version_consistency.py -o addopts= -v

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Create virtual environment
      run: |
        uv venv

    - name: Install dependencies
      run: |
        uv pip install -e ".[dev]"

    - name: Run ruff check
      run: |
        uv run ruff check .

    - name: Run ruff format check
      run: |
        uv run ruff format --check .

  package:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Build wheel and sdist
      run: |
        uv build

    - name: Check both distributions were produced
      run: |
        ls -l dist/
        ls dist/*.whl
        ls dist/*.tar.gz

    - name: Install the wheel into a throwaway environment
      run: |
        uv venv "$RUNNER_TEMP/wheelenv"
        uv pip install --python "$RUNNER_TEMP/wheelenv/bin/python" dist/*.whl

    - name: Import the installed package from outside the checkout
      working-directory: ${{ runner.temp }}
      run: |
        "$RUNNER_TEMP/wheelenv/bin/python" - <<'PY'
        import importlib
        import importlib.util
        import os

        import keeks

        if importlib.util.find_spec("pandas") is not None:
            raise SystemExit("pandas is present in the wheel environment")

        workspace = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
        if os.path.realpath(keeks.__file__).startswith(workspace + os.sep):
            raise SystemExit(
                f"imported keeks from the checkout ({keeks.__file__}), not the wheel"
            )

        for name in [
            "keeks.bankroll",
            "keeks.utils",
            "keeks.simulators.random_binary",
            "keeks.simulators.random_uncertain_binary",
            "keeks.simulators.repeated_binary",
        ]:
            importlib.import_module(name)

        strategies = importlib.import_module("keeks.binary_strategies")
        exported = list(strategies.__all__)
        if not exported:
            raise SystemExit("keeks.binary_strategies.__all__ is empty")
        for name in exported:
            getattr(strategies, name)

        print(f"imported {keeks.__file__} plus {len(exported)} exported strategies")
        PY
