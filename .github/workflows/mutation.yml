name: Mutation Testing

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Create virtual environment
      run: uv venv

    - name: Install dependencies
      run: |
        uv pip install -e ".[dev]"
        uv pip install "mutmut==3.7.0"

    # The [tool.mutmut] section of pyproject.toml controls what mutmut copies
    # into its scratch mutants/ tree and strips the repo's --cov pytest
    # addopts so each mutant run pays no coverage overhead.
    # mutmut 3.7.0 exits 0 even when mutants survive, so the campaign alone
    # never gates CI — the survivor-budget step below counts the results and
    # fails explicitly on a budget breach.
    - name: Run mutation campaign
      run: uv run mutmut run

    - name: Enforce the survivor budget
      run: |
        uv run python - <<'PY'
        import subprocess
        import sys

        # Ceiling allowed by the quality spec (<=60 survivors, >=97% score);
        # the measured post-hardening baseline is ~34-35 non-killed (30
        # survived + 4 timeouts, 98.2-98.3%). Tighten this budget as
        # survivors are killed; never raise it to make a run pass.
        SURVIVOR_BUDGET = 60

        # mutmut prints one "    <mutant>: <status>" line per mutant that is
        # not killed; the status vocabulary is fixed by the pinned version.
        STATUSES = {
            "survived",
            "no tests",
            "timeout",
            "suspicious",
            "skipped",
            "segfault",
            "caught by type check",
            "check was interrupted by user",
            "not checked",
        }

        output = subprocess.run(
            ["uv", "run", "mutmut", "results"],
            capture_output=True,
            text=True,
            check=True,
        ).stdout

        counts = {}
        for line in output.splitlines():
            if not line.strip():
                continue
            _, _, status = line.strip().rpartition(": ")
            if status not in STATUSES:
                sys.exit(f"unrecognized mutmut result line: {line!r}")
            counts[status] = counts.get(status, 0) + 1

        print("mutation results:", counts or "all mutants killed")

        problems = []
        non_killed = counts.get("survived", 0) + counts.get("timeout", 0)
        if non_killed > SURVIVOR_BUDGET:
            problems.append(
                f"{non_killed} non-killed mutants exceed the survivor budget "
                f"of {SURVIVOR_BUDGET} (survived={counts.get('survived', 0)}, "
                f"timeout={counts.get('timeout', 0)})"
            )
        for status in sorted(STATUSES - {"survived", "timeout"}):
            if counts.get(status):
                problems.append(f"{counts[status]} mutants reported {status!r}")
        for problem in problems:
            print(f"::error::{problem}")
        if problems:
            sys.exit(1)
        print(f"within budget: {non_killed} non-killed <= {SURVIVOR_BUDGET}")
        PY
